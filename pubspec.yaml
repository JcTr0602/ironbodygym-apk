name: ironbody_gym
description: APK offline-first para entrenadores de Iron Body Gym (Trinidad, Cuba).
publish_to: "none"
version: 1.33.0+94

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  image_picker: ^1.1.2
  image: ^4.2.0
  uuid: ^4.5.1
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  workmanager: ^0.10.10
  share_plus: ^10.1.2
  file_picker: ^8.1.2
  flutter_contacts: ^1.1.9
  url_launcher: ^6.3.1
  crypto: ^3.0.7
  flutter_image_compress: ^2.3.0
  flutter_foreground_task: ^8.0.0
  # v1.4.4 (v33): vista previa Markdown del editor GymPedia.
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.6
  flutter_launcher_icons: ^0.14.3
  # 1.34 (fotos-variantes y comprobantes): los tests de generación usan la
  # implementación REAL del canal del plugin (con su validador de
  # extensión) sobre un canal nativo simulado; sin esta dependencia
  # el paquete es solo transitivo y no se puede importar en tests.
  flutter_image_compress_common: 1.1.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    # 1.30 D1 (UI130-29 + portadas ALTA-02): el arte de
    # marca del PIN y las 5 portadas de categoría GymPedia.
    - assets/arte_marca_rayo.jpg
    - assets/gympedia_entrenamiento.jpg
    - assets/gympedia_nutricion.jpg
    - assets/gympedia_suplementos.jpg
    - assets/gympedia_descanso.jpg
    - assets/gympedia_tecnica.jpg
    # 1.30 D5 (UI130-18, ALTA-02): las 6 fotos genéricas del
    # catálogo de suplementos sin foto propia.
    - assets/sup_generica_proteina.jpg
    - assets/sup_generica_creatina.jpg
    - assets/sup_generica_preentreno.jpg
    - assets/sup_generica_shaker.jpg
    - assets/sup_generica_barritas.jpg
    - assets/sup_generica_botella.jpg
    # 1.30 D6 (UI130-22, ALTA-02): las 12 ilustraciones de
    # la lámina de vacíos, una por estado vacío asignado.
    - assets/vacio_papelera.jpg
    - assets/vacio_caja.jpg
    - assets/vacio_escudo.jpg
    - assets/vacio_sobre.jpg
    - assets/vacio_lupa.jpg
    - assets/vacio_recepcion.jpg
    - assets/vacio_pomo.jpg
    - assets/vacio_reloj.jpg
    - assets/vacio_calendario.jpg
    - assets/vacio_cable.jpg
    - assets/vacio_pastel.jpg
    - assets/vacio_megafono.jpg
