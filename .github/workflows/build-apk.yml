name: Build APK (Iron Body Gym)

# Compila la APK release en los servidores de GitHub y la deja como
# artefacto descargable. Se dispara a mano desde la pestaña Actions.
# Firma: debug-key estándar (misma en cualquier máquina con Android SDK),
# suficiente para instalación interna; las actualizaciones mantienen firma.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ironbody-gym-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
