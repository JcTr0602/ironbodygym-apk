name: Build APK (Iron Body Gym)

# Compila la APK release en los servidores de GitHub y la deja como
# artefacto descargable. Se dispara a mano desde la pestaña Actions.
# Firma: llave release persistente (secretos KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD). Sin secretos, cae a la llave debug (solo desarrollo).

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Setup keystore de firma release
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.p12
            printf 'storeFile=release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.KEYSTORE_PASSWORD }}" \
              "${{ secrets.KEY_ALIAS }}" \
              "${{ secrets.KEY_PASSWORD }}" > android/key.properties
            echo "Firma release activada."
          else
            echo "Sin secreto KEYSTORE_BASE64: se firma con debug."
          fi

      - name: Verificar versión
        run: |
          PUB=$(grep '^version:' pubspec.yaml | sed 's/version: \([0-9.]*\).*/\1/')
          CFG=$(grep "static const appVersion" lib/config.dart | sed "s/.*'\(.*\)'.*/\1/")
          if [ "$PUB" != "$CFG" ]; then
            echo "❌ Versión desactualizada: pubspec=$PUB pero config.dart=$CFG"
            exit 1
          fi
          echo "✅ Versión $PUB consistente."

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ironbody-gym-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
